
version: 2

models:
  - name: silver_unique_customers
    description: "Imported customer records"
    columns:
      - name: customer_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: silver_unique_products
    description: "Imported customer records"
    columns:
      - name: product_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: product_category
        description: "The product category (store department)"
        data_tests:
          - not_null
      - name: unit_price
        description: "The product's unit price'"
        data_tests:
          - not_null

  - name: silver_unique_orders
    description: "Imported order records"
    columns:
      - name: order_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing bronze_customers"
        data_tests:
          - not_null
      - name: product_id
        description: "Foreign key referencing bronze_products"
        data_tests:
          - not_null
      - name: order_date
        description: "Date the order was placed"
        data_tests:
          - not_null
      - name: quantity
        description: "Quantity purchased"
        data_tests:
          - not_null
      - name: order_status
        description: "Status of the order: can be completed, returned, or cancelled"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled']